<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Comedy Mastermind</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0ece4;
      font-family: 'Nunito Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }

    h1 {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      text-align: center;
      line-height: 1.5;
      margin-top: -12px;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 16px;
      color: #f0ece4;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #e93626; }

    button {
      width: 100%;
      background: #e93626;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }

    .message.error { color: #e93626; }
    .message.success { color: #4caf50; }

    .back-link {
      font-size: 13px;
      color: #555;
      text-decoration: none;
      margin-top: -8px;
    }

    .back-link:hover { color: #888; }
  </style>
</head>
<body>

<div class="card">
  <img src="/favicon2.png" class="logo" alt="Comedy Mastermind">
  <h1>Reset Your Password</h1>
  <p class="subtitle">Enter a new password for your Comedy Mastermind account.</p>

  <div class="form" id="reset-form">
    <input type="password" id="new-password" placeholder="New password" autocomplete="new-password">
    <input type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password">
    <button id="submit-btn" onclick="handleReset()">Update Password</button>
  </div>

  <div class="message error" id="error-msg"></div>
  <div class="message success" id="success-msg"></div>

  <a href="https://comedymastermind.com" class="back-link">← Back to Comedy Mastermind</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Initialize Supabase client
  const SUPABASE_URL = 'https://mwwcdcusixbyuduzfbyl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13d2NkY3VzaXhieXVkdXpmYnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk1OTkzODAsImV4cCI6MjA2NTE3NTM4MH0.0hAj2HMPbKRcYJNh3LEKP5s_dGVOIAjFZA4fNqGVbJE';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Extract token from URL (Supabase sends it as a hash or query param)
  async function init() {
    const hash = window.location.hash;
    const params = new URLSearchParams(window.location.search);

    // Handle hash-based token (e.g. #access_token=...&type=recovery)
    if (hash && hash.includes('access_token')) {
      const hashParams = new URLSearchParams(hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      if (accessToken) {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken || ''
        });
        if (error) {
          showError('This reset link is invalid or has expired. Please request a new one.');
          document.getElementById('reset-form').style.display = 'none';
        }
      }
    }
  }

  init();

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
  }

  async function handleReset() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const btn = document.getElementById('submit-btn');

    if (!newPassword || newPassword.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    if (newPassword !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    const { error } = await supabase.auth.updateUser({ password: newPassword });

    if (error) {
      showError('Failed to update password. Your reset link may have expired. Please request a new one.');
      btn.disabled = false;
      btn.textContent = 'Update Password';
      return;
    }

    showSuccess('Password updated successfully! Redirecting to the app...');
    document.getElementById('reset-form').style.display = 'none';

    setTimeout(() => {
      window.location.href = 'https://comedymastermind.com';
    }, 2000);
  }
</script>

</body>
</html>
